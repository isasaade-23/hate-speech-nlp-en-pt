# Run the api:  docker compose -f deploy/docker-compose.yml up --build
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: hsc-api
    ports:
      - "8000:8000"
    environment:
      - HSC_MODEL_ID=${HSC_MODEL_ID:-stack_strict_s42}
      - HSC_API_KEYS=${HSC_API_KEYS:?defina HSC_API_KEYS (nome:sha256hex,...)}
      - HSC_RATE_PER_MIN=${HSC_RATE_PER_MIN:-600}
    restart: unless-stopped
