site_name: Bilingual Hate-Speech Detection (EN/PT)
site_description: Classical vs. transformer models for English/Portuguese hate-speech detection — a reproducible study with a deployable API.
site_author: Isabela Venancio da Silva
repo_url: https://github.com/isasaade-23/hate-speech-nlp-en-pt
repo_name: isasaade-23/hate-speech-nlp-en-pt

theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Results: results.md
  - Methodology: methodology.md
  - API and product: api.md
  - Reproducibility: reproducibility.md
