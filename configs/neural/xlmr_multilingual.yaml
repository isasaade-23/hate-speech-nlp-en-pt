name: xlmr_multilingual
family: neural
policy: strict
seed: 42
text_column: text_clean
languages: [en, pt]      # single model for both languages
model:
  hf_checkpoint: FacebookAI/xlm-roberta-base
  max_length: 160
  problem: binary
train:
  epochs: 4
  batch_size: 16
  grad_accum: 1
  lr: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  class_weights: balanced     # or focal (ablation)
  fp16: true
  seeds: [42, 43, 44]         # multi-seed for CI (report mean +/- std)
eval:
  primary_metric: macro_f1
