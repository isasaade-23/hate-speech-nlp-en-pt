name: tfidf_lgbm
family: classical
policy: strict
seed: 42
text_column: text_clean
features:
  type: tfidf
  word:
    ngram_range: [1, 2]
    min_df: 3
    max_features: 50000
    sublinear_tf: true
  char:
    analyzer: char_wb
    ngram_range: [3, 5]
    min_df: 3
    max_features: 50000
    sublinear_tf: true
model:
  type: lgbm
  params:
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 63
    class_weight: balanced
    n_jobs: -1
