name: tfidf_svm
family: classical
policy: strict
seed: 42
text_column: text_clean
features:
  type: tfidf
  word:
    ngram_range: [1, 2]
    min_df: 3
    max_features: 150000
    sublinear_tf: true
  char:
    analyzer: char_wb
    ngram_range: [3, 5]
    min_df: 3
    max_features: 150000
    sublinear_tf: true
model:
  type: svm          # LinearSVC wrapped in CalibratedClassifierCV for probabilities
  params:
    C: 1.0
    class_weight: balanced
