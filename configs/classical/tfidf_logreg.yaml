name: tfidf_logreg
family: classical
policy: strict           # override with --policy on the CLI
seed: 42
text_column: text_clean
features:
  type: tfidf
  word:
    ngram_range: [1, 2]
    min_df: 3
    max_features: 150000
    sublinear_tf: true
  char:
    analyzer: char_wb
    ngram_range: [3, 5]
    min_df: 3
    max_features: 150000
    sublinear_tf: true
model:
  type: logreg
  params:
    C: 1.0
    class_weight: balanced
    max_iter: 1000
    solver: liblinear
# 2026-08-16 (corpus v5): max_features raised 50k -> 150k per block. The corpus
# doubled (53.5k -> 113.8k rows) and the 50k ceiling was binding; val-only
# capacity sweep: 150k/min_df=3 = full vocab (256,921 dims), val AUC 0.8827 -> 0.8843.
