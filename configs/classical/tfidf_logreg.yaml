name: tfidf_logreg
family: classical
policy: strict           # override with --policy on the CLI
seed: 42
text_column: text_clean
features:
  type: tfidf
  word:
    ngram_range: [1, 2]
    min_df: 3
    max_features: 50000
    sublinear_tf: true
  char:
    analyzer: char_wb
    ngram_range: [3, 5]
    min_df: 3
    max_features: 50000
    sublinear_tf: true
model:
  type: logreg
  params:
    C: 1.0
    class_weight: balanced
    max_iter: 1000
    solver: liblinear
